services:
  tdm-harness:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: test-data-management-harness
    ports:
      - "127.0.0.1:4300:4300"
    environment:
      TDM_HOST: "0.0.0.0"
      TDM_PORT: "4300"
      TDM_DEFAULT_TTL_SECONDS: "3600"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

