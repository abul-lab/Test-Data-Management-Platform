name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Typecheck, Test & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package & verification tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps

      - name: Ruff lint check
        run: ruff check src tests

      - name: Mypy strict static type check
        run: mypy src

      - name: Pytest enterprise TDM, FPE, Tarjan subsetting, SQLite, AI & MCP suite
        run: pytest -v

      - name: Execute CLI Release Readiness Gatekeeper check
        run: tdm-guard release-gate --min-score 90.0

      - name: Audit Python dependencies for known CVEs
        run: pip-audit -r requirements-dev.txt

