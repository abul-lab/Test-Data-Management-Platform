apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: datasandboxes.tdm.enterprise.io
spec:
  group: tdm.enterprise.io
  names:
    kind: DataSandbox
    listKind: DataSandboxList
    plural: datasandboxes
    singular: datasandbox
    shortNames:
      - sbx
      - tdmsbx
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["domain", "rowScale", "ttlSeconds"]
              properties:
                tenantId:
                  type: string
                domain:
                  type: string
                  enum: ["financial_ledger", "healthcare_claims", "commerce_orders"]
                rowScale:
                  type: integer
                  minimum: 1
                  maximum: 2000
                seed:
                  type: integer
                ttlSeconds:
                  type: integer
                fpeMode:
                  type: string
                  enum: ["NIST_FF3_1", "HMAC_TOKENIZE"]
                edgeCaseProfile:
                  type: string
                  enum: ["HAPPY_PATH", "PAIRWISE_MINIMAL", "BOUNDARY_HEAVY", "CHAOS_ADVERSARIAL"]

